sonar.projectKey=front-trt
sonar.projectName=FrontTRT
sonar.sourceEncoding=UTF-8

sonar.sources=src,electron
sonar.tests=src,e2e
sonar.test.inclusions=src/**/*.spec.ts,e2e/**/*.ts
sonar.exclusions=**/node_modules/**,dist/**,dist_electron/**,coverage/**,test-results/**,.angular/**,**/*.min.js

sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.tsconfigPaths=tsconfig.json,tsconfig.app.json,tsconfig.spec.json

sonar.coverage.exclusions=src/**/*.spec.ts,e2e/**,electron/**,src/main.ts,src/env/**,src/types/**
sonar.cpd.exclusions=src/**/*.spec.ts,e2e/**
