<div class="login-container">
  <div class="login-left">
    <div class="login-form-wrapper">
      <img [ngSrc]="logoPath" width="610" height="469" alt="Logo refaccionaria" class="logo" priority />

      <h1 class="login-title">Acceso al Sistema</h1>
      <p class="login-description">
        Ingresa con tus credenciales asignadas por el administrador o empleador.
      </p>

      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" novalidate>
        <app-input
          id="username"
          formControlName="username"
          label="Usuario"
          placeholder="Ingresa tu usuario"
          [hasError]="usernameCtrl.invalid && usernameCtrl.touched"
          errorMessage="El usuario es requerido"
        />

        <app-input
          id="password"
          type="password"
          formControlName="password"
          label="Contraseña"
          placeholder="Ingresa tu contraseña"
          autocomplete="current-password"
          [hasError]="passwordCtrl.invalid && passwordCtrl.touched"
          errorMessage="La contraseña es requerida"
        />

        <div class="form-actions">
          <app-button
            type="submit"
            [disabled]="submitDisabled"
            [loading]="loading()"
            loadingText="Ingresando..."
            [fullWidth]="true"
          >
            Ingresar
          </app-button>
        </div>
      </form>
    </div>
  </div>

  <div class="login-right" aria-hidden="true">
    <img [ngSrc]="backgroundImagePath" fill alt="" class="login-img" priority />
  </div>
</div>
