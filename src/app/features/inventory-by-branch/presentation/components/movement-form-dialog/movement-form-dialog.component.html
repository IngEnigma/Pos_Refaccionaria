<div class="movement-form-container">
  <header class="dialog-header">
    <div class="header-icon">
      <lucide-icon name="ArrowLeftRight" [size]="24"></lucide-icon>
    </div>
    <div class="header-content">
      <h2 class="dialog-title">Registrar Movimiento</h2>
      <p class="dialog-subtitle">Registra una entrada o salida de inventario.</p>
    </div>
    <button class="btn-close" (click)="onCancel()" aria-label="Cerrar">
      <lucide-icon name="X" [size]="20"></lucide-icon>
    </button>
  </header>

  <form [formGroup]="movementForm" (ngSubmit)="onSubmit()" class="dialog-form">
    <div class="form-grid">
      <div class="form-group full-width">
        <label for="tipoMovimiento">Tipo de Movimiento</label>
        <div class="select-wrapper" [class.error]="isFieldInvalid('tipoMovimiento')">
          <select id="tipoMovimiento" formControlName="tipoMovimiento">
            <option *ngFor="let t of movementTypes" [value]="t.value">{{ t.label }}</option>
          </select>
        </div>
      </div>

      <div class="form-group full-width">
        <label for="idProducto">Producto</label>
        <div class="input-wrapper" [class.error]="isFieldInvalid('idProducto')">
          <lucide-icon name="Package" [size]="18" class="input-icon"></lucide-icon>
          <input
            id="idProducto"
            type="number"
            formControlName="idProducto"
            placeholder="ID del producto"
            [attr.readonly]="data.idProducto ? true : null">
        </div>
        <span class="hint-text" *ngIf="data.productName">{{ data.productName }}</span>
        <span class="hint-text" *ngIf="data.stock !== undefined && isSalida">
          Stock actual: {{ data.stock }}
        </span>
        <span class="error-text" *ngIf="isFieldInvalid('idProducto')">El producto es requerido</span>
      </div>

      <div class="form-group">
        <label for="cantidad">Cantidad</label>
        <div class="input-wrapper" [class.error]="isFieldInvalid('cantidad')">
          <lucide-icon name="Hash" [size]="18" class="input-icon"></lucide-icon>
          <input id="cantidad" type="number" formControlName="cantidad" placeholder="1" min="1">
        </div>
        <span class="error-text" *ngIf="isFieldInvalid('cantidad')">La cantidad debe ser mayor a 0</span>
      </div>

      <div class="form-group">
        <label for="razon">Razón</label>
        <div class="input-wrapper" [class.error]="isFieldInvalid('razon')">
          <lucide-icon name="FileText" [size]="18" class="input-icon"></lucide-icon>
          <input id="razon" type="text" formControlName="razon" placeholder="Motivo del movimiento">
        </div>
        <span class="error-text" *ngIf="isFieldInvalid('razon')">La razón es requerida (mín. 3 caracteres)</span>
      </div>

      <div class="form-group full-width">
        <label for="observaciones">Observaciones (opcional)</label>
        <div class="input-wrapper">
          <lucide-icon name="MessageSquare" [size]="18" class="input-icon"></lucide-icon>
          <input id="observaciones" type="text" formControlName="observaciones" placeholder="Notas adicionales">
        </div>
      </div>
    </div>

    <footer class="dialog-footer">
      <app-button
        type="button"
        variant="secondary"
        (click)="onCancel()"
        class="footer-btn">
        Cancelar
      </app-button>
      <app-button
        type="submit"
        variant="primary"
        [disabled]="movementForm.invalid"
        class="footer-btn">
        <lucide-icon name="Check" [size]="18"></lucide-icon>
        Registrar Movimiento
      </app-button>
    </footer>
  </form>
</div>
