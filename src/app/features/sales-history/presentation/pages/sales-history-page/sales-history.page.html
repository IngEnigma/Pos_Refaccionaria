<div class="page-container animate-fade-in">
  <header class="page-header">
    <div class="header-content">
      <h1 class="page-title">Historial de Ventas</h1>
      <p class="page-subtitle">Consulta y gestiona los registros de ventas pasadas</p>
    </div>
    <div class="header-actions">
      <button class="btn-refresh" (click)="loadSalesHistory()" [disabled]="isLoading()">
        <i class="lucide-rotate-cw" [class.spinning]="isLoading()"></i>
        Actualizar
      </button>
    </div>
  </header>


  <!-- Filter Bar -->
  <div class="filter-bar" *ngIf="!error()">
    <div class="search-box">
      <i class="lucide-search"></i>
      <input 
        type="text" 
        placeholder="Buscar por ID o Usuario..." 
        [ngModel]="searchQuery()"
        (ngModelChange)="onSearchChange($event)"
      >
    </div>

    <div class="filter-actions">
      <select 
        [ngModel]="filterPaymentMethod()"
        (ngModelChange)="onPaymentMethodChange($event)"
      >
        <option [ngValue]="null">Todos los métodos</option>
        <option [ngValue]="1">Efectivo</option>
        <option [ngValue]="2">Tarjeta</option>
      </select>
      <input
        type="number"
        class="filter-input"
        placeholder="Sucursal ID (staff)"
        [ngModel]="filterSucursalId()"
        (ngModelChange)="onSucursalChange($event)"
        min="1"
      >
      <input
        type="number"
        class="filter-input"
        placeholder="Inventario ID"
        [ngModel]="filterInventarioId()"
        (ngModelChange)="onInventarioChange($event)"
        min="1"
      >
    </div>
  </div>

  <main class="page-content animate-slide-up">
    @if (error()) {
      <div class="error-state">
        <p>{{ error() }}</p>
        <button (click)="loadSalesHistory()">Reintentar</button>
      </div>
    } @else {
      <app-sales-history-table 
        [sales]="pagedSales()" 
        [loading]="isLoading()"
        (viewDetail)="handleViewDetail($event)">
      </app-sales-history-table>

      @if (!isLoading() && totalItems() > 0) {
        <div class="pagination-bar">
          <span class="pagination-info">
            Mostrando {{ rangeStart() }}–{{ rangeEnd() }} de {{ totalItems() }}
          </span>

          <div class="pagination-controls">
            <button
              class="page-btn"
              (click)="prevPage()"
              [disabled]="currentPage() <= 1"
              aria-label="Página anterior"
            >
              ‹ Anterior
            </button>

            @for (page of pageNumbers(); track page) {
              <button
                class="page-btn page-number"
                [class.active]="page === currentPage()"
                (click)="goToPage(page)"
              >
                {{ page }}
              </button>
            }

            <button
              class="page-btn"
              (click)="nextPage()"
              [disabled]="currentPage() >= totalPages()"
              aria-label="Página siguiente"
            >
              Siguiente ›
            </button>
          </div>

          <label class="page-size">
            Por página:
            <select [ngModel]="pageSize()" (ngModelChange)="onPageSizeChange($event)">
              @for (size of pageSizeOptions; track size) {
                <option [ngValue]="size">{{ size }}</option>
              }
            </select>
          </label>
        </div>
      }
    }
  </main>

  @if (selectedSale()) {
    <app-sale-detail-modal 
      [sale]="selectedSale()!" 
      [sellerName]="selectedSellerName() || ''"
      (close)="closeDetail()">
    </app-sale-detail-modal>
  }
</div>
