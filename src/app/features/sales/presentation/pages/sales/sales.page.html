<div class="sales-root">
  <main class="sales-main animate-slide-up">
    <section class="catalog-section">
      <h2 class="section-title">Categorías</h2>

      <app-category-slider
        [categories]="categories()"
        [isLoading]="loadingCategories()"
        [selectedCategoryId]="selectedCategoryId()"
        (selected)="onSelectCategory($event)"
      />
      
      <h2 class="section-title">Productos</h2>

      <app-product-grid
        [products]="productos()"
        [loadingProducts]="loadingProducts()"
        (addToCart)="onAddToCart($event)"
        (loadMore)="onLoadMore()"
      />

    </section>
  </main>

  <app-cart-panel class="animate-fade-in"
    [cartItems]="cartItems()"
    [subtotal]="subtotal()"
    [descuento]="descuento()"
    [iva]="iva()"
    [total]="total()"
    [paymentMethods]="paymentMethods()"
    [selectedPayment]="selectedPayment()"
    [loading]="isCreatingSale()"
    [disabled]="submitDisabled()"
    (removeItem)="onRemoveItem($event)"
    (increaseQty)="onIncreaseQty($event)"
    (decreaseQty)="onDecreaseQty($event)"
    (selectPayment)="onSelectPayment($event)"
    (processTransaction)="processTransaction()"
  />
</div>
