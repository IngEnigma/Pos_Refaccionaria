<div class="payment-section">
  <div class="payment-title">Seleccionar método de pago</div>

  <div class="payment-buttons">
    @if (paymentMethods().length === 0) {
      <p class="empty-cart">No hay métodos de pago disponibles.</p>
    } @else {
      @for (method of paymentMethods(); track method.id) {
        <button
          class="payment-btn"
          [class.selected]="selectedPayment()?.id === method.id"
          (click)="selectPayment.emit(method)"
          type="button"
        >
          <lucide-icon [name]="resolveIcon(method)" class="icon" />
          <div class="payment-text">{{ method.tipo }}</div>
        </button>
      }
    }
  </div>
</div>
