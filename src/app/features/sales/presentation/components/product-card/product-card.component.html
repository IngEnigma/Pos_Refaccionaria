<article class="product-card">
  @if (product().imagen) {
    <img
      class="product-img"
      [src]="product().imagen"
      [alt]="product().nombre"
    />
  } @else {
    <div class="product-img-placeholder">
      <lucide-icon name="Package" [size]="48" class="placeholder-icon"></lucide-icon>
    </div>
  }
  <h3 class="product-name">{{ product().nombre }}</h3>
  <p class="product-desc">{{ product().descripcion }}</p>

  <div class="product-row">
    <span class="product-price">${{ product().precio }}</span>
    <span class="product-stock">{{ product().stock }}</span>
  </div>

  <app-button
    variant="primary"
    size="compact"
    [fullWidth]="true"
    (onClick)="onAdd()"
  >
    Añadir
  </app-button>
</article>
