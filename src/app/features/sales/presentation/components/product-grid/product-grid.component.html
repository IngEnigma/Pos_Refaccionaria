<div class="products-grid" aria-label="Lista de productos">
  @for (producto of products(); track producto.id) {
    <app-product-card
      [product]="producto"
      (addToCart)="addToCart.emit($event)"
    />
  }

  @if (loadingProducts()) {
    @for (item of skeletonItems; track item) {
      <app-product-card-skeleton />
    }
  }
</div>

<div #sentinel class="scroll-sentinel"></div>
