<section class="record-page">
  <h1 class="page-title">Historial de Ventas</h1>

  <ul class="sales-list">
    @for (sale of sales; track sale.id) {
      <li class="sale-item">
        <div class="sale-main">
          <span class="sale-id">Venta #{{ sale.id }}</span>
          <span class="sale-date">{{ sale.fecha }}</span>
        </div>

        <div class="sale-details">
          <span><strong>Cliente:</strong> Público general</span>
          <span><strong>Método:</strong> {{ sale.metodoPago }}</span>
          <span class="sale-total">$ {{ sale.total }}</span>
        </div>
      </li>

      <div class="sale-separator"></div>
    }
  </ul>
</section>
