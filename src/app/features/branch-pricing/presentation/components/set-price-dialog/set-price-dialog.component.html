<div class="price-form-container">
  <header class="dialog-header">
    <div class="header-icon">
      <lucide-icon name="DollarSign" [size]="24"></lucide-icon>
    </div>
    <div class="header-content">
      <h2 class="dialog-title">Fijar Precio de Sucursal</h2>
      <p class="dialog-subtitle">Establece un precio específico para este producto en la sucursal.</p>
    </div>
    <button class="btn-close" (click)="onCancel()" aria-label="Cerrar">
      <lucide-icon name="X" [size]="20"></lucide-icon>
    </button>
  </header>

  <form [formGroup]="priceForm" (ngSubmit)="onSubmit()" class="dialog-form">
    <div class="form-group">
      <label for="precioVenta">Precio de Venta (MXN)</label>
      <div class="input-wrapper" [class.error]="isFieldInvalid('precioVenta')">
        <lucide-icon name="DollarSign" [size]="18" class="input-icon"></lucide-icon>
        <input
          id="precioVenta"
          type="number"
          formControlName="precioVenta"
          placeholder="0.00"
          min="0.01"
          step="0.01"
        />
      </div>
      <span class="error-text" *ngIf="isFieldInvalid('precioVenta')">
        El precio debe ser mayor a $0.00
      </span>
    </div>

    <footer class="dialog-footer">
      <app-button
        type="button"
        variant="secondary"
        (click)="onCancel()"
        class="footer-btn">
        Cancelar
      </app-button>
      <app-button
        type="submit"
        variant="primary"
        [disabled]="priceForm.invalid"
        class="footer-btn">
        <lucide-icon name="Check" [size]="18"></lucide-icon>
        Fijar Precio
      </app-button>
    </footer>
  </form>
</div>
