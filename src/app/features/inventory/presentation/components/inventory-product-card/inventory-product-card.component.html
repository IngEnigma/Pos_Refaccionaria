<article class="product-card">
  <div class="product-img-placeholder">
    <lucide-icon name="Package" [size]="48" class="placeholder-icon"></lucide-icon>
  </div>
  <h3 class="product-name">{{ product().nombre }}</h3>
  <p class="product-desc">{{ $any(product()).clave || $any(product()).descripcion || 'Sin descripción' }} · {{ $any(product()).marca }}</p>

  <div class="product-row">
    <span class="product-price">
      ${{ effectivePrice() | number:'1.2-2' }}
      @if (hasSucursalPrice()) {
        <span class="price-badge">Sucursal</span>
      }
    </span>
    @if (stock() !== null) {
      <span class="product-stock" [class.low-stock]="isLowStock()">{{ stock() }} en stock</span>
    }
  </div>

  <div class="product-actions">
    <app-button
      variant="primary"
      size="sm"
      [fullWidth]="true"
      (click)="onModify()"
    >
      Modificar
    </app-button>
    <app-button
      variant="secondary"
      size="sm"
      [fullWidth]="true"
      (click)="onChangePrice()"
    >
      Precio
    </app-button>
    <app-button
      variant="danger"
      size="sm"
      [fullWidth]="true"
      (click)="onDelete()"
    >
      Eliminar
    </app-button>
  </div>
</article>
