<article class="product-card">
  <div class="product-img-placeholder">
    <!-- Place holder for image -->
    <lucide-icon name="Package" [size]="48" class="placeholder-icon"></lucide-icon>
  </div>
  <h3 class="product-name">{{ product().nombre }}</h3>
  <p class="product-desc">{{ product().descripcion || 'Sin descripción' }}</p>

  <div class="product-row">
    <span class="product-price">${{ product().precioVenta }}</span>
    <span class="product-stock" [class.low-stock]="product().existencia <= 5">
      {{ product().existencia }}
    </span>
  </div>

  <div class="product-actions">
    <app-button
      variant="primary"
      size="sm"
      [fullWidth]="true"
      (click)="onModify()"
    >
      Modificar
    </app-button>
    <app-button
      variant="danger"
      size="sm"
      [fullWidth]="true"
      (click)="onDelete()"
    >
      Eliminar
    </app-button>
  </div>
</article>
