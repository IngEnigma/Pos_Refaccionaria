<div class="suppliers-root">
  <main class="suppliers-main animate-slide-up">
    <section class="suppliers-section">
      <div class="section-header">
        <div>
          <h1 class="page-title">Proveedores</h1>
          <p class="page-subtitle">Gestiona la red de proveedores y su información de contacto.</p>
        </div>
        <button class="btn-add-supplier" (click)="onAddSupplier()">
          <lucide-icon name="Plus" [size]="18"></lucide-icon> Registrar Proveedor
        </button>
      </div>

      <app-supplier-list
        [suppliers]="suppliersFacade.suppliers()"
        [loading]="suppliersFacade.loading()"
        (edit)="onEditSupplier($event)"
        (delete)="onDeleteSupplier($event)"
      />
    </section>
  </main>
</div>
