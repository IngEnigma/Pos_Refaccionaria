<header class="navbar" role="banner">
  <app-search-input (searchChange)="onSearchChange($event)"></app-search-input>

  <div class="user-section">
    <div class="user-info">
    <span class="username">{{ username() }}</span>
    <span class="date">{{ currentDate() }}</span>
  </div>

    <app-dropdown #profileDropdown>
      <app-icon-button
        appDropdownTrigger
        [icon]="profileIconPath()"
        [isActive]="profileDropdown.open()"
        ariaLabel="Perfil"
        label="Perfil"
      />
      <app-dropdown-menu>
        <app-dropdown-item icon="log-out" variant="danger" (action)="onLogout()">
          Cerrar sesión
        </app-dropdown-item>
      </app-dropdown-menu>
    </app-dropdown>

    <app-dropdown #notificationsDropdown>
      <app-icon-button
        appDropdownTrigger
        [icon]="notificationsIconPath()"
        [isActive]="notificationsDropdown.open()"
        ariaLabel="Notificaciones"
        label="Notificaciones"
      />
      <app-dropdown-menu>
        @for (notification of notifications(); track notification.id) {
          <app-dropdown-item [icon]="notification.icon ?? 'circle-alert'">
            {{ notification.title }}
            @if (notification.description) {
              <span class="notification-description">{{ notification.description }}</span>
            }
          </app-dropdown-item>
        } @empty {
          <app-dropdown-item>
            No hay notificaciones
          </app-dropdown-item>
        }
      </app-dropdown-menu>
    </app-dropdown>
  </div>
</header>
