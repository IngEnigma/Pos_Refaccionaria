<aside class="sidebar" aria-label="Navegación principal">
  <div class="sidebar-logo">
    <img [ngSrc]="logoPath()" width="242" height="74" alt="Logo Refaccionaria" class="logo-h" priority />
  </div>

  <nav class="sidebar-nav">
    <ul class="sidebar-list">
      @for (item of navItems(); track item.id) {
        <li class="sidebar-item">
          @if (!item.disabled) {
            <a
              [routerLink]="item.route"
              routerLinkActive="sidebar-link-active"
              [routerLinkActiveOptions]="{ exact: item.exact ?? false }"
              class="sidebar-link"
            >
              <lucide-icon [name]="item.icon" [size]="20" aria-hidden="true" class="icon"></lucide-icon>
              <span class="link-text">{{ item.label }}</span>
            </a>
          } @else {
            <span class="sidebar-link sidebar-link-disabled" aria-disabled="true" tabindex="-1">
              <lucide-icon [name]="item.icon" [size]="20" aria-hidden="true" class="icon"></lucide-icon>
              <span class="link-text">{{ item.label }}</span>
            </span>
          }
        </li>
      }
    </ul>
  </nav>
</aside>
