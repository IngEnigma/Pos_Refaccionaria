  <lucide-icon name="search" [size]="20" class="search-icon" aria-hidden="true"></lucide-icon>

  <input
    id="layout-search"
    type="text"
    [placeholder]="searchPlaceholder()"
    class="search-input"
    aria-label="Buscar en el sistema"
    (input)="onSearchInput($event)"
  />

</div>
